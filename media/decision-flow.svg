<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">SUBWAY GAME decision flow / 의사결정 흐름</title>
  <desc id="desc">Historical observations pass quality checks, chronological prediction, safety and feasibility screening, voluntary citizen mission, and aggregate operator evaluation. Observations and simulations remain separately labeled.</desc>
  <rect width="1280" height="430" rx="32" fill="#ecf3fb"/>
  <text x="48" y="63" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10243d">관측에서 시민 미션까지: 하나의 의사결정 흐름</text>
  <text x="48" y="96" font-family="Arial,sans-serif" font-size="19" fill="#45627f">Observation → prediction → safety gate → citizen choice → operator evaluation</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(48 135)"><rect width="214" height="174" rx="20" fill="#fff" stroke="#c7d8e9"/><circle cx="34" cy="35" r="18" fill="#2d61ee"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">1</text><text x="20" y="77" font-size="19" font-weight="700" fill="#10243d">관측자료 점검</text><text x="20" y="105" font-size="16" fill="#43607b">10칸 열차 방문 재구성</text><text x="20" y="137" font-size="14" fill="#65809a">Observation · quality</text></g>
    <g transform="translate(287 135)"><rect width="214" height="174" rx="20" fill="#fff" stroke="#c7d8e9"/><circle cx="34" cy="35" r="18" fill="#2d61ee"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">2</text><text x="20" y="77" font-size="19" font-weight="700" fill="#10243d">혼잡도 예측</text><text x="20" y="105" font-size="16" fill="#43607b">날짜 분리 평가</text><text x="20" y="137" font-size="14" fill="#65809a">XGBoost vs baseline</text></g>
    <g transform="translate(526 135)"><rect width="214" height="174" rx="20" fill="#fff" stroke="#c7d8e9"/><circle cx="34" cy="35" r="18" fill="#2d61ee"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">3</text><text x="20" y="77" font-size="19" font-weight="700" fill="#10243d">안전한 후보</text><text x="20" y="105" font-size="16" fill="#43607b">격차·보행·접근성</text><text x="20" y="137" font-size="14" fill="#65809a">Feasible choice</text></g>
    <g transform="translate(765 135)"><rect width="214" height="174" rx="20" fill="#fff" stroke="#c7d8e9"/><circle cx="34" cy="35" r="18" fill="#2d61ee"/><text x="34" y="41" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">4</text><text x="20" y="77" font-size="19" font-weight="700" fill="#10243d">시민 미션</text><text x="20" y="105" font-size="16" fill="#43607b">수락·이동·완료</text><text x="20" y="137" font-size="14" fill="#65809a">Voluntary mission</text></g>
    <g transform="translate(1004 135)"><rect width="228" height="174" rx="20" fill="#0b1d34"/><circle cx="34" cy="35" r="18" fill="#30c3ca"/><text x="34" y="41" text-anchor="middle" fill="#072135" font-size="17" font-weight="700">5</text><text x="20" y="77" font-size="19" font-weight="700" fill="#fff">관리자 평가</text><text x="20" y="105" font-size="16" fill="#c0d3e7">집계·정책 비교</text><text x="20" y="137" font-size="14" fill="#87a9c8">Operations control</text></g>
    <path d="M263 222h22m217 0h22m217 0h22m217 0h23" fill="none" stroke="#2d61ee" stroke-width="4" stroke-linecap="round"/>
    <path d="M279 216l8 6-8 6m239-12l8 6-8 6m239-12l8 6-8 6m239-12l8 6-8 6" fill="none" stroke="#2d61ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="48" y="339" width="1184" height="52" rx="14" fill="#dcebf9"/>
  <text x="68" y="371" font-family="Arial,sans-serif" font-size="16" fill="#284a6a">증거 경계: 객차 혼잡은 과거 관측, 승강장 대기열·수락·이동·에너지는 시뮬레이션입니다. / Observed ≠ simulated</text>
</svg>
